name: Regenerate rankings index and manifest

on:
  push:
    branches: [main]
    paths:
      - 'data/**.json'
      - 'images/**'
      - '!data/manifest.json'
      - '!data/character_results/index.json'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Index first: it's a data file the manifest hashes too.
      - run: node scripts/generate-rankings-index.mjs
      - run: node scripts/generate-manifest.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/character_results/index.json
          git diff --cached --quiet || git commit -m "Regenerate rankings index and data manifest [skip ci]"
          git push

      # The site bundles data/ and images/ into its GitHub Pages deploy; this redeploys it with
      # what was just pushed. SITE_DEPLOY_TOKEN: a fine-grained token with only Actions read/write
      # on jjc-astra/wuwa-calc-site (the built-in GITHUB_TOKEN can't run another repo's workflows).
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml -R jjc-astra/wuwa-calc-site --ref main
